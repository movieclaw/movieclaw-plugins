# One plugin, one release. Tag <id>-v<version> (hello-note-v0.1.0).
# Every release is created with --latest=false, including the long-lived
# catalog release that carries index.json. Do not point clients at
# /releases/latest: whichever plugin was published last would win.
#
# The Release body is this version's CHANGELOG section. After publishing, the
# index is rebuilt from main (store.json, the committed index.json) and the tags
# (what each version declared), signed, uploaded to the catalog release, and
# committed back to main.

name: release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

# Shared with catalog.yml: one writer of index.json at a time.
concurrency:
  group: plugin-catalog
  cancel-in-progress: false

env:
  # MovieClaw v0.43.0. The same pin as ci.yml.
  MOVIECLAW_REF: fae7ec10bf6aef8b12c819134930014fbe01d5cb
  CATALOG_TAG: catalog

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
      # gh release / gh api in the steps below
      GH_TOKEN: ${{ github.token }}
      # Ed25519 PKCS#8 PEM. Required: the app rejects an unsigned index.
      # Optional RELEASE_SIGNING_KEY_ID selects key_id (default catalog-1).
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      RELEASE_SIGNING_KEY_ID: ${{ secrets.RELEASE_SIGNING_KEY_ID }}
    steps:
      - name: Require the signing key
        run: |
          if [ -z "${RELEASE_SIGNING_KEY}" ]; then
            echo "::error::没有配置 Actions secret RELEASE_SIGNING_KEY。MovieClaw 只接受签名的索引，未签名的索引发出去市场会拒绝加载。"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # every tag: each version's manifest is read at its own tag
          fetch-depth: 0

      - name: Check the tag against the manifest and CHANGELOG
        id: tag
        run: python3 scripts/check_tag.py

      - name: Checkout MovieClaw
        uses: actions/checkout@v4
        with:
          repository: movieclaw/MovieClaw
          ref: ${{ env.MOVIECLAW_REF }}
          path: .movieclaw

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .movieclaw/pyproject.toml

      - name: Install pinned MovieClaw
        run: python3 -m pip install -e .movieclaw jsonschema cryptography

      - name: Validate with Manifest and check_compat
        env:
          PLUGIN_ID: ${{ steps.tag.outputs.id }}
        run: |
          set -euo pipefail
          python3 .movieclaw/src/movieclaw_agent/builtin-skills/movieclaw-plugin-dev/scripts/check_plugin.py "plugins/${PLUGIN_ID}"

      - name: Pack
        id: pack
        env:
          PLUGIN_ID: ${{ steps.tag.outputs.id }}
          PLUGIN_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          file="dist/${PLUGIN_ID}-${PLUGIN_VERSION}.mcplugin"
          line="$(python3 scripts/pack.py "plugins/${PLUGIN_ID}" --output "$file")"
          echo "$line"
          sha="$(printf '%s\n' "$line" | awk '{print $3}')"
          size="$(printf '%s\n' "$line" | awk '{print $5}')"
          printf '%s\n' "$sha" > "${file}.sha256"
          python3 scripts/release_notes.py "$PLUGIN_ID" "$PLUGIN_VERSION" > dist/notes.md
          {
            echo "file=${file}"
            echo "sha=${sha}"
            echo "size=${size}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the plugin release
        env:
          PLUGIN_ID: ${{ steps.tag.outputs.id }}
          PLUGIN_VERSION: ${{ steps.tag.outputs.version }}
          ASSET: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" --clobber
            gh release edit "$TAG" --notes-file dist/notes.md
          else
            args=(
              gh release create "$TAG" "$ASSET" "${ASSET}.sha256"
              --latest=false
              --verify-tag
              --title "${PLUGIN_ID} ${PLUGIN_VERSION}"
              --notes-file dist/notes.md
            )
            case "$PLUGIN_VERSION" in
              *-*) args+=(--prerelease) ;;
            esac
            "${args[@]}"
          fi

      - name: Rebuild the catalog index on main
        env:
          PLUGIN_ID: ${{ steps.tag.outputs.id }}
          PLUGIN_VERSION: ${{ steps.tag.outputs.version }}
          SHA: ${{ steps.pack.outputs.sha }}
          SIZE: ${{ steps.pack.outputs.size }}
        run: |
          set -euo pipefail
          # store.json and the committed index live on main; versions come from the tags
          git fetch origin main
          git checkout -B main origin/main
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          args=(
            python3 scripts/generate_index.py
            --previous index.json
            --fetch-downloads
            --output dist/index.json
            --assets dist/assets
            --generated-at "$stamp"
            --release "$PLUGIN_ID" "$PLUGIN_VERSION" "$SHA" "$SIZE" "$stamp"
          )
          "${args[@]}" --sign --sig dist/index.json.sig

      - name: Upload index.json and images to the catalog release
        run: bash scripts/upload_catalog.sh

      - name: Commit index.json on main
        run: |
          set -euo pipefail
          cp dist/index.json index.json
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update plugin index for ${TAG}"
          git push origin main
