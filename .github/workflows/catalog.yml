# Publish index.json without a new plugin release: a summary, icon, yank or
# deprecation changed in store.json, and the PR regenerated index.json with
# `python3 scripts/generate_index.py --update`. Also runs by hand (Actions →
# catalog → Run workflow), e.g. after adding the signing key.
#
# The committed index.json is the source. This job checks that it still
# reproduces from the tree, signs it, and uploads it with its images.

name: catalog

on:
  push:
    branches: [main]
    paths:
      - index.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-catalog
  cancel-in-progress: false

env:
  CATALOG_TAG: catalog

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      RELEASE_SIGNING_KEY_ID: ${{ secrets.RELEASE_SIGNING_KEY_ID }}
    steps:
      - name: Require the signing key
        run: |
          if [ -z "${RELEASE_SIGNING_KEY}" ]; then
            echo "::error::没有配置 Actions secret RELEASE_SIGNING_KEY。MovieClaw 只接受签名的索引，未签名的索引发出去市场会拒绝加载。"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check and rebuild index.json
        run: |
          set -euo pipefail
          python3 -m pip install jsonschema cryptography
          python3 scripts/generate_index.py --check index.json
          stamp="$(python3 -c 'import json; print(json.load(open("index.json"))["generated_at"])')"
          args=(
            python3 scripts/generate_index.py
            --previous index.json
            --output dist/index.json
            --assets dist/assets
            --generated-at "$stamp"
          )
          "${args[@]}" --sign --sig dist/index.json.sig

      - name: Upload index.json and images to the catalog release
        run: bash scripts/upload_catalog.sh
