[plugin]
id = "seed-hub"
title = "保种管家"
version = "1.1.0"
entry = "seed_hub"
runtime = "process"
sdk = "^1.0"
description = "自动转种 + IYUU 自动辅种 + 保活守护，一个插件全管。转种：把源下载器（如 qB）已完成的种搬到目标下载器（如 TR）继续保种（读磁盘种子文件，任意版本 qB/TR 都能当源；WebUI 导出兜底），路径映射用内核已配的；加种后还会持续校验目标结果，校验失败的空壳任务自动清掉。辅种：已完成种拿去 IYUU 匹配其他站点，内核带站点登录态取种（插件碰不到 Cookie），沿用原种保存路径；站点标签能分清主种/辅种与来源。守护：站点已删种 / 数据丢失的种自动清理，MovieClaw 主种里的空壳会先用内核删种预演判断——会被订阅重下的一律保留，绝不删文件。删片联动：媒体库里删片或清空回收站，对应的下载任务立刻停（还供着别的文件、有 H&R 风险、会牵动订阅重下的一律保留）。左侧栏「保种管家」一页：概览、待清理、运行日志；周期在「定时任务」可调；每轮结果可作为事件被 Webhook / 别的插件订阅。"

[requires]
"scheduled-tasks" = "^1.0"
"plugin-files" = "^1.0"
# 订阅下载完成 / 入库完成 → 立刻补跑一轮转种（不用等定时任务）
"download.completed" = "^2.0"
"library.ingest.completed" = "^1.0"
# 删片 / 清空回收站 → 对应的下载任务立刻停（可靠事件，注入 DURABLE_EVENTS）
"library.file.deleted" = "^2.0"
"library.file.purged" = "^2.0"
"kernel/durable-events" = "^1.0"
# 插件自己的事件（转种 / 辅种 / 守护跑完），供 Webhook 与别的插件订阅
"plugin-events" = "^1.0"
# 常驻任务降级（下载器连不上、校验监视连续出错）→ 系统通知
"plugin-health" = "^1.0"

[permissions]
# dl.tasks：取全部下载器的任务快照（已完成种、判重、按下载器过滤）
# dl.submit：辅种时带站点登录态取种并投递（插件碰不到站点凭据，免密码通道）
# dl.list：把设置里填的下载器名称解析成实例（带出路径映射，转种路径换算用）
# dl.torrent.delete：转移成功后按设置删源任务 / 守护清理死种（危险操作；默认关闭，只删任务不删文件）
# site.list / site.show：把 IYUU 的 sid 映射到本机已配置站点
# site.proxy.request（危险操作）：借宿主已认证会话打开站点详情页，解析真实取种链接
#   （IYUU 模板过期/需要 sign 时兜底；凭据不出宿主）
# dl.file-sources.list：按媒体库文件 id 反查它来自哪个下载任务（删片后停种用）
operations = ["dl.tasks", "dl.submit", "dl.list", "dl.file-sources.list", "dl.torrent.delete", "site.list", "site.show", "search.torrents", "site.proxy.request"]
# search.torrents：取种前按发布名在目标站搜真实下载链接（IYUU 模板链接缺 passkey 在不少站取不到）
# 源下载器的种子文件目录（BT_backup / torrents）：只读，找 <info_hash>.torrent。
# 商店版不预设路径：装好后到插件设置里填好目录，安装批准时再授予对应路径。
paths = []
network = true

# 每轮跑完发一条插件事件：Webhook 能勾、「通知」里开了就能推到手机 / IM
[[events]]
name = "seed-hub.transfer.completed"
title = "转种完成"

[[events]]
name = "seed-hub.reseed.completed"
title = "辅种完成"

[[events]]
name = "seed-hub.sweep.completed"
title = "保活守护完成"

# 通知默认关（default = false）：想看推送的人在「设置 → 通知」里打开
[[notifications]]
event = "seed-hub.transfer.completed"
title = "转种完成：{transferred} 个"
body = "计划 {planned}，失败 {failed}，删源 {deleted_source}"
audience = "admins"
level = "passive"
default = false
open = "plugin"

[[notifications]]
event = "seed-hub.sweep.completed"
title = "保种管家清理了 {deleted} 个失效任务"
body = "另有 {warned} 个只告警未删；只删任务、不删文件"
audience = "admins"
level = "passive"
default = false
open = "plugin"
