[plugin]
id = "trakt-sync"
title = "Trakt 自动追踪"
version = "0.2.1"
entry = "trakt_sync"
runtime = "process"
sdk = "^1.0"
description = "将 MovieClaw 播放活动自动同步到各成员绑定的 Trakt 账号"

[requires]
"playback.started" = "^2.0"
"playback.progress" = "^1.0"
"playback.stopped" = "^1.0"
"playback.completed" = "^1.0"
"plugin-data" = "^1.0"
"plugin-routes" = "^1.0"
"plugin-health" = "^1.0"
"kernel/durable-events" = "^1.0"

[permissions]
operations = []
network = true
events = ["playback.started", "playback.progress", "playback.stopped", "playback.completed"]
