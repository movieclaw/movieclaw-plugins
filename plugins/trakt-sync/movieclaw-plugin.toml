[plugin]
id = "trakt-sync"
title = "Trakt 自动追踪"
version = "0.3.0"
entry = "trakt_sync"
runtime = "process"
sdk = "^1.0"
description = "将 MovieClaw 播放活动自动同步到各成员绑定的 Trakt 账号"

[requires]
"playback.started" = "^2.0"
"playback.progress" = "^1.0"
"playback.stopped" = "^1.1"
"playback.completed" = "^1.1"
"plugin-data" = "^1.0"
"plugin-routes" = "^1.0"
"plugin-health" = "^1.0"
"kernel/durable-events" = "^1.0"

"playback.marked_played" = "^1.0"
"playback.marked_unplayed" = "^1.0"
"library.item.favorited" = "^2.0"

[permissions]
network = true
operations = ["library.list", "library.items.get", "playback.sync.catalog", "playback.sync.import"]
events = ["playback.started", "playback.progress", "playback.stopped", "playback.completed", "playback.marked_played", "playback.marked_unplayed", "library.item.favorited"]
